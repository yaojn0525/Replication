### Overnight Index
# X-1B and X-1D are essentially the same type of overnight index
# in theory, they should be identical
# in practice, we allow them to diverge 
# we will see how this helps when introducing composite index 
SOFR-1B:
  type: OVERNIGHT INDEX
  convention: Sofr
SOFR-CME-1B:
  type: OVERNIGHT INDEX
  convention: Sofr
SOFR-1D:
  type: OVERNIGHT INDEX
  convention: Sofr
