### Composite Index
# 1B => COMPOUND   => -COMPOUND
#    => ARITHMETIC => -AVERAGE
# 1D => ARITHMETIC => -AVG
# The benefit of introducing 1D allows "inconsistency" between
# COMPOUND and ARITHEMTIC
USD-SOFR-COMPOUND:
  type: OVERNIGHT COMPOSITE INDEX
  convention: 
    index : SOFR-1B
    compound method : COMPOUND
USD-SOFR-CME-COMPOUND:
  type: OVERNIGHT COMPOSITE INDEX
  convention: 
    index : SOFR-CME-1B
    compound method : COMPOUND
USD-SOFR-AVERAGE:
  type: OVERNIGHT COMPOSITE INDEX
  convention: 
    index : SOFR-1B
    compound method : ARITHMETIC
USD-SOFR-AVG:
  type: OVERNIGHT COMPOSITE INDEX
  convention: 
    index : SOFR-1D
    compound method : ARITHMETIC
